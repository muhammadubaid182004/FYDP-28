services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./backend/.env
    ports:
      - "8000:8000"
    environment:
      PORT: "8000"
      NODE_ENV: production
      FRONTEND_URL: http://localhost:3000
      MODEL_ONNX_PATH: ${MODEL_ONNX_PATH:-best.onnx}
      MODEL_ENGINE_PATH: ${MODEL_ENGINE_PATH:-models/best.engine}
      ALLOW_ONNX_FALLBACK: ${ALLOW_ONNX_FALLBACK:-true}
      MODEL_CLASS_LABELS: ${MODEL_CLASS_LABELS:-Nrdr,Rdr}
      MODEL_INPUT_SIZE: ${MODEL_INPUT_SIZE:-256}
      # DATABASE_URL and other secrets: backend/.env (your existing Postgres).
    volumes:
      - ./models:/app/models:ro

  client:
    build:
      context: ./Client
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend
