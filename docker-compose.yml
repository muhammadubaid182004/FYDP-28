version: '3.9'

services:
  # ─────────────────────────────────────────────────────────────
  # Frontend Service (Node.js + React)
  # ─────────────────────────────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dr-detection-frontend
    ports:
      - "3000:3000"
    environment:
      - VITE_API_BASE_URL=http://localhost:8000
    depends_on:
      - backend
    volumes:
      - ./src:/app/src
      - ./public:/app/public
    networks:
      - dr-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ─────────────────────────────────────────────────────────────
  # Backend Service (Node.js + Express)
  # Communicates with external Jetson Orin Nano
  # ─────────────────────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: dr-detection-backend
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - NODE_ENV=${NODE_ENV:-production}
      - JWT_SECRET=${JWT_SECRET:-change-this-in-production}
      - FRONTEND_URL=http://localhost:3000
      - JETSON_IP_ADDRESS=${JETSON_IP_ADDRESS:-localhost}
      - DB_PATH=/app/data/predictions.db
    volumes:
      - backend_data:/app/data
    networks:
      - dr-network
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8000/healthz"]
      interval: 10s
      timeout: 5s
      start-period: 5s
      retries: 3

networks:
  dr-network:
    driver: bridge

volumes:
  backend_data:
