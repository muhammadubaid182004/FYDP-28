services:
  # Backend Service
  - type: web
    name: diabetic-vision-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 8000
      - key: MODEL_ONNX_PATH
        value: best.onnx
      - key: MODEL_S3_URI
        value: s3://fydp-28/models/best.onnx
      - key: MODEL_INPUT_SIZE
        value: 256
      - key: MODEL_CLASS_LABELS
        value: Nrdr,Rdr
      - key: ALLOW_ONNX_FALLBACK
        value: true
      - key: AWS_REGION
        value: eu-north-1
      - key: S3_URI
        value: s3://fydp-28
      - key: JWT_SECRET
        generateValue: true
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: diabetic-vision-db
          property: connectionString
      - key: FRONTEND_URL
        value: https://diabetic-vision-frontend.onrender.com
    healthCheckPath: /healthz

  # Frontend Service
  - type: web
    name: diabetic-vision-frontend
    runtime: docker
    dockerfilePath: ./Client/Dockerfile
    dockerContext: ./Client
    envVars:
      - key: VITE_API_BASE_URL
        value: https://diabetic-vision-backend.onrender.com

databases:
  - name: diabetic-vision-db
    databaseName: diabetic_vision
    user: diabetic_vision_user
